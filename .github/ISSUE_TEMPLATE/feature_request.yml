name: Feature request
description: Suggest an improvement to FAIA.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the proposed behavior and any alternatives considered.
    validations:
      required: true
