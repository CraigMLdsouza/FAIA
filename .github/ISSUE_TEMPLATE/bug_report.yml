name: Bug report
description: Report a reproducible problem with FAIA.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the issue and the expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FAIA version or commit
      placeholder: "Commit SHA or release tag"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include minimal steps and sanitized logs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and MCP/REST client if relevant.
